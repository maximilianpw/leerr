name: Leerr
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  Leerr:
    path: .
targets:
  Leerr-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/Leerr
    info:
      path: .build/Leerr-iOS-Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Connect to your music server on your local network.
    dependencies:
      - package: Leerr
        product: LeerrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leerr.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Leerr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  Leerr-macOS:
    type: application
    platform: macOS
    sources:
      - Apps/Leerr
    dependencies:
      - package: Leerr
        product: LeerrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leerr.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Leerr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Leerr.entitlements
schemes:
  Leerr-iOS:
    build:
      targets:
        Leerr-iOS: all
  Leerr-macOS:
    build:
      targets:
        Leerr-macOS: all
